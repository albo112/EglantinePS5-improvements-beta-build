name: Build pinned EglantinePS5 Test4-A
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-pinned-test4a.yml'

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 125
    defaults:
      run:
        shell: bash
    env:
      JOBS: "3"
      RADV_BUILD_JOBS: "2"
    steps:
      - name: Free disk space for Eglantine, Mesa and SDK dependencies
        run: |
          df -h "$GITHUB_WORKSPACE"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk /opt/hostedtoolcache/PyPy \
            /opt/hostedtoolcache/Ruby
          df -h "$GITHUB_WORKSPACE"

      - name: Checkout versioned source repository
        uses: actions/checkout@v4

      - name: Reconstruct pinned frontend and core with 264 ordered overlays
        run: |
          set -euo pipefail
          echo "EG_SOURCE=$RUNNER_TEMP/EglantinePS5-Test4A-Full-Source" >> "$GITHUB_ENV"
          bash source-versions/scripts/reconstruct-latest.sh "$RUNNER_TEMP/EglantinePS5-Test4A-Full-Source"
          test "$(git -C "$RUNNER_TEMP/EglantinePS5-Test4A-Full-Source" rev-parse HEAD)" = 25cfc07be0a3675749adece5d012fdb916c4cd48
          test "$(git -C "$RUNNER_TEMP/EglantinePS5-Test4A-Full-Source/Eglantine" rev-parse HEAD)" = 0ca2032bffc5f1a3fca75427f7d4a4718adda660
          grep -q '^EDEN_NX2_MEMORY_GB=12' "$RUNNER_TEMP/EglantinePS5-Test4A-Full-Source/profiles/env-0400486024dec000.txt"
          grep -q '^EDEN_NX2_PIPELINE_WORKERS=2' "$RUNNER_TEMP/EglantinePS5-Test4A-Full-Source/profiles/env-0400486024dec000.txt"

      - name: Set up native build cache paths
        run: |
          set -euo pipefail
          cache_root="$(dirname "$GITHUB_WORKSPACE")/ci-cache"
          mkdir -p "$cache_root"
          {
            echo "CACHE_ROOT=$cache_root"
            echo "EGLANTINEPS5_DEPS_CACHE=$cache_root/downloads"
            echo "CCACHE_DIR=$cache_root/ccache"
            echo "XDG_CACHE_HOME=$cache_root/xdg"
            echo "SPIRV_TRANSLATOR=$cache_root/spirv-llvm-translator"
          } >> "$GITHUB_ENV"

      - name: Restore downloadable dependency cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CACHE_ROOT }}/downloads
          key: eglantine-test4a-downloads-${{ hashFiles('source-versions/01_Test4A_12GiB_2Workers_LATEST/SOURCE.json') }}

      - name: Install Ubuntu 24.04 PS5/LLVM toolchain
        working-directory: ${{ env.EG_SOURCE }}
        run: |
          set -euo pipefail
          bash tools/ci/setup-ubuntu-24.04.sh "$SPIRV_TRANSLATOR" 3>> "$GITHUB_ENV"
          make toolchain

      - name: Fetch other pinned dependencies
        working-directory: ${{ env.EG_SOURCE }}
        run: make deps

      - name: Build PS5 release ZIP
        id: native
        working-directory: ${{ env.EG_SOURCE }}
        timeout-minutes: 105
        run: |
          set -euo pipefail
          ccache --zero-stats || true
          bash tools/ci/build-release.sh 2>&1 | tee "$RUNNER_TEMP/test4a-native-build.log"

      - name: Verify the generated package
        if: steps.native.outcome == 'success'
        working-directory: ${{ env.EG_SOURCE }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import glob,zipfile
          files=glob.glob("EglantinePS5-v*.zip")
          assert len(files)==1, files
          with zipfile.ZipFile(files[0]) as z:
              assert z.testzip() is None
              assert "PPSA98515/eboot.bin" in z.namelist()
              print("Verified PS5 release:",files[0],len(z.namelist()),"entries")
          PY

      - name: Upload build output, symbols and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eglantine-test4a-12gib-2workers-build-${{ github.run_number }}
          path: |
            ${{ env.EG_SOURCE }}/dist/
            ${{ env.EG_SOURCE }}/build/symbols/
            ${{ runner.temp }}/test4a-native-build.log
          if-no-files-found: warn
          retention-days: 7
